name: Node Health Monitor

on:
  push:
    paths:
      - 'logs/node-status.json'

permissions:
  issues: write
  contents: read

jobs:
  check-node-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read node status
        id: status
        run: |
          if [ ! -f logs/node-status.json ]; then
            echo "No status file found"
            exit 0
          fi

          # Read status file
          STATUS=$(cat logs/node-status.json)
          echo "status=$STATUS" >> $GITHUB_OUTPUT

          # Parse JSON
          ALERT_LEVEL=$(echo "$STATUS" | jq -r '.alert_level')
          ALERT_MESSAGE=$(echo "$STATUS" | jq -r '.alert_message')
          TIMESTAMP=$(echo "$STATUS" | jq -r '.timestamp')
          PEERS=$(echo "$STATUS" | jq -r '.peers')
          ERRORS=$(echo "$STATUS" | jq -r '.errors_last_10min')
          WARNINGS=$(echo "$STATUS" | jq -r '.warnings_last_10min')

          echo "alert_level=$ALERT_LEVEL" >> $GITHUB_OUTPUT
          echo "alert_message=$ALERT_MESSAGE" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "peers=$PEERS" >> $GITHUB_OUTPUT
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT

      - name: Create or update issue for critical alert
        if: steps.status.outputs.alert_level == 'critical'
        uses: actions/github-script@v7
        with:
          script: |
            const alertMessage = `${{ steps.status.outputs.alert_message }}`;
            const timestamp = `${{ steps.status.outputs.timestamp }}`;
            const peers = `${{ steps.status.outputs.peers }}`;
            const errors = `${{ steps.status.outputs.errors }}`;
            const warnings = `${{ steps.status.outputs.warnings }}`;

            // Check for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'node-health,critical',
              creator: 'github-actions[bot]'
            });

            const issueBody = `🔴 **CRITICAL ALERT**\n\n` +
              `**Problem:** ${alertMessage}\n\n` +
              `**Current Status:**\n` +
              `- 🕐 Time: ${timestamp}\n` +
              `- 👥 Peers: ${peers} (target: 36)\n` +
              `- ❌ Errors (last 10min): ${errors}\n` +
              `- ⚠️  Warnings (last 10min): ${warnings}\n\n` +
              `---\n` +
              `*Last updated: ${timestamp}*\n` +
              `*Auto-generated by node monitoring system*`;

            if (issues.data.length > 0) {
              // Update existing issue
              const issue = issues.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `**Update:** Still experiencing issues\n\n${issueBody}`
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔴 Node Health Alert: ${alertMessage}`,
                body: issueBody,
                labels: ['node-health', 'critical'],
                assignees: ['${{ github.repository_owner }}']
              });
            }

      - name: Create or update issue for warning
        if: steps.status.outputs.alert_level == 'warning'
        uses: actions/github-script@v7
        with:
          script: |
            const alertMessage = `${{ steps.status.outputs.alert_message }}`;
            const timestamp = `${{ steps.status.outputs.timestamp }}`;
            const peers = `${{ steps.status.outputs.peers }}`;
            const errors = `${{ steps.status.outputs.errors }}`;
            const warnings = `${{ steps.status.outputs.warnings }}`;

            // Check for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'node-health,warning',
              creator: 'github-actions[bot]'
            });

            const issueBody = `⚠️ **WARNING**\n\n` +
              `**Problem:** ${alertMessage}\n\n` +
              `**Current Status:**\n` +
              `- 🕐 Time: ${timestamp}\n` +
              `- 👥 Peers: ${peers} (target: 36)\n` +
              `- ❌ Errors (last 10min): ${errors}\n` +
              `- ⚠️  Warnings (last 10min): ${warnings}\n\n` +
              `---\n` +
              `*Last updated: ${timestamp}*\n` +
              `*Auto-generated by node monitoring system*`;

            if (issues.data.length > 0) {
              // Update existing issue
              const issue = issues.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `**Update:**\n\n${issueBody}`
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `⚠️ Node Health Warning: ${alertMessage}`,
                body: issueBody,
                labels: ['node-health', 'warning'],
                assignees: ['${{ github.repository_owner }}']
              });
            }

      - name: Close resolved issues
        if: steps.status.outputs.alert_level == 'healthy'
        uses: actions/github-script@v7
        with:
          script: |
            const timestamp = `${{ steps.status.outputs.timestamp }}`;
            const peers = `${{ steps.status.outputs.peers }}`;

            // Find all open node-health issues
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'node-health',
              creator: 'github-actions[bot]'
            });

            // Close all open issues
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ **RESOLVED**\n\n` +
                  `Node has recovered and is operating normally.\n\n` +
                  `**Current Status:**\n` +
                  `- 🕐 Time: ${timestamp}\n` +
                  `- 👥 Peers: ${peers}\n` +
                  `- ✅ No active alerts\n\n` +
                  `Closing this issue automatically.`
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
