# Prometheus configuration for Tezos node monitoring
# Based on: https://octez.tezos.com/user/node-monitoring.html

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'tezos-node'
    static_configs:
      - targets: ['host.docker.internal:9095']
    scrape_interval: 15s

  # node_exporter - Hardware metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node_exporter:9100']
        labels:
          instance: 'host.docker.internal:9100'
